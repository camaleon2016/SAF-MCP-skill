name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Red-team tests
        run: npm test

      - name: Verify dist output
        run: |
          test -f dist/index.js
          test -f dist/server.js
          test -f dist/http.js
          test -f dist/openai.js
          test -f dist/engine/analyze.js
          test -f dist/engine/rules.js
          test -f dist/governance/logger.js
          test -f dist/governance/access.js

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high

  catalog-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check out pinned SAF-MCP upstream
        run: |
          COMMIT=$(node -p "require('./scripts/upstream.json').commit")
          git clone --filter=blob:none --quiet https://github.com/safe-agentic-framework/safe-mcp.git ../safe-mcp
          git -C ../safe-mcp checkout --quiet "$COMMIT"

      - name: Verify catalog matches upstream
        run: npx tsx scripts/sync-catalog.ts --upstream ../safe-mcp --check
